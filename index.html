<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>3D-просмотрщик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","appwrite":"https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/esm/sdk.js"}}
  </script>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131b; color: #f5f6fa; }
    body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
    header { min-height: 64px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:#10131b; border-bottom:1px solid #282d3a; z-index:2; }
    .brand { min-width:0; } h1 { font-size:16px; margin:0 0 3px; font-weight:700; }
    #filename { color:#9ca5b8; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw; }
    button, .file-button { border:0; border-radius:11px; background:#6978ff; color:white; font-family:inherit; font-size:13px; font-weight:650; line-height:1.2; padding:11px 12px; cursor:pointer; white-space:nowrap; }
    button:disabled { opacity:.45; cursor:default; }
    #stage { position:relative; flex:1; min-height:0; touch-action:none; }
    canvas { display:block; width:100%; height:100%; }
    #empty { position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; pointer-events:none; }
    #empty-card { max-width:340px; padding:25px; border:1px dashed #454d61; border-radius:20px; background:rgba(24,28,39,.88); }
    #empty .icon { font-size:38px; margin-bottom:10px; }
    #empty p { color:#aeb6c7; font-size:14px; line-height:1.5; margin:8px 0 0; }
    #hint { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100% - 24px); border-radius:999px; padding:9px 13px; color:#d9deeb; background:rgba(12,15,22,.72); font-size:12px; text-align:center; pointer-events:none; }
    #error { display:none; position:absolute; left:12px; right:12px; top:12px; padding:12px 14px; background:#642e3c; border:1px solid #a84c62; border-radius:12px; font-size:13px; line-height:1.4; z-index:1; }
    footer { flex:none; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); background:#10131b; border-top:1px solid #282d3a; }
    #light-controls { display:flex; align-items:center; gap:12px; padding:0 4px 9px; color:#bdc5d5; font-size:12px; }
    #light-controls label { white-space:nowrap; } #angle-label { color:#fff; font-variant-numeric:tabular-nums; }
    #light-angle { flex:1; min-width:60px; height:24px; accent-color:#8290ff; touch-action:pan-x; }
    #actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    #actions button { flex:1; min-width:0; white-space:normal; background:#252b39; padding:11px 8px; }
    #actions button.primary { background:#6978ff; }
    #actions button[hidden] { display:none; }
    input[type=file] { display:none; }
    @media (min-width:700px) { header { padding-left:22px; padding-right:22px; } #actions { display:flex; justify-content:center; } #actions button { flex:initial; min-width:150px; } #light-controls { max-width:580px; margin:0 auto; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>3D‑просмотрщик</h1><div id="filename">Модель не загружена</div></div>
    <label class="file-button" for="file">Открыть .glb</label>
    <input id="file" type="file" accept=".glb,model/gltf-binary">
  </header>
  <main id="stage">
    <div id="empty"><div id="empty-card"><div class="icon">◇</div><strong>Загрузите 3D-модель</strong><p>Выберите файл <b>.glb</b>. Перетаскивайте модель пальцем, чтобы вращать; сведите или разведите пальцы для масштаба.</p></div></div>
    <div id="error"></div>
    <div id="hint">Вращение — перетаскивание · масштаб — щипок или колёсико</div>
  </main>
  <footer>
    <div id="light-controls"><label for="light-angle">Поворот света <span id="angle-label">225°</span></label><input id="light-angle" type="range" min="0" max="360" step="1" value="225"></div>
    <div id="actions">
      <button id="reset">Сбросить вид</button>
      <button id="open-file" class="primary">Открыть .glb</button>
      <button id="upload-share" class="primary" disabled>Загрузить и поделиться</button>
      <button id="copy-link" hidden>Скопировать ссылку</button>
    </div>
  </footer>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Client, Account, Storage, ID, Permission, Role } from 'appwrite';
    // Публичные настройки проекта: API-ключи и токен бота здесь не нужны.
    const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
    const APPWRITE_PROJECT_ID = '6aedc88f00016f942ffb';
    const APPWRITE_BUCKET_ID = 'models';
    const BOT_USERNAME = 'tg3d_viewer_bot';
    const MAX_FILE_BYTES = 25 * 1024 * 1024;
    const configured = !APPWRITE_PROJECT_ID.includes('ВСТАВЬ_');
    const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT_ID);
    const account = new Account(client);
    const storage = new Storage(client);
    const tg = window.Telegram?.WebApp;
    let uploading = false;
    let loadVersion = 0;

    const stage = document.querySelector('#stage');
    const fileInput = document.querySelector('#file');
    const filename = document.querySelector('#filename');
    const empty = document.querySelector('#empty');
    const errorBox = document.querySelector('#error');
    const uploadButton = document.querySelector('#upload-share');
    const copyButton = document.querySelector('#copy-link');
    const angleSlider = document.querySelector('#light-angle');
    const angleLabel = document.querySelector('#angle-label');
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#171b26');
    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 1000); camera.position.set(3, 2.2, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75)); renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15; stage.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x657089, 1.8));
    const keyLight = new THREE.DirectionalLight(0xffffff, 3.0); scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x9dafff, 1.1); scene.add(fillLight);
    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = false;
    controls.minDistance = 0.03; controls.maxDistance = 500; controls.target.set(0, 0, 0);
    const loader = new GLTFLoader(); let currentModel = null; let currentFile = null; let shareUrl = '';

    let renderFrame = 0;
    function requestRender() {
      if (renderFrame) return;
      renderFrame = requestAnimationFrame(() => { renderFrame = 0; controls.update(); renderer.render(scene, camera); });
    }
    controls.addEventListener('change', requestRender);
    function resize() { const w = Math.max(stage.clientWidth, 1), h = Math.max(stage.clientHeight, 1); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); requestRender(); }
    new ResizeObserver(resize).observe(stage); resize();
    function showError(message) { errorBox.textContent = message; errorBox.style.display = 'block'; }
    function disposeModel(obj) { obj.traverse(node => { if (node.geometry) node.geometry.dispose(); if (node.material) for (const mat of (Array.isArray(node.material) ? node.material : [node.material])) { for (const value of Object.values(mat)) if (value && value.isTexture) value.dispose(); mat.dispose(); } }); }
    function frameModel(model) {
      const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3()); model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1, fov = THREE.MathUtils.degToRad(camera.fov), distance = (maxDim / 2) / Math.tan(fov / 2) * 1.55;
      camera.position.set(distance * .9, distance * .62, distance * 1.05); camera.near = Math.max(maxDim / 1000, .001); camera.far = maxDim * 100; camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0); controls.minDistance = maxDim * .05; controls.maxDistance = maxDim * 30; controls.update();
      setLightAngle(Number(angleSlider.value));
    }
    function setLightAngle(degrees) {
      const radians = degrees * Math.PI / 180, radius = 5;
      keyLight.position.set(Math.sin(radians) * radius, 6, Math.cos(radians) * radius);
      fillLight.position.set(-Math.sin(radians) * radius, 2.5, -Math.cos(radians) * radius);
      angleLabel.textContent = `${degrees}°`;
      requestRender();
    }
    async function displayGlb(buffer, label, keepFile = null, version = loadVersion) {
      const header = new DataView(buffer);
      if (buffer.byteLength < 12 || header.getUint32(0, true) !== 0x46546c67 || header.getUint32(4, true) !== 2 || header.getUint32(8, true) !== buffer.byteLength) throw new Error('Некорректный GLB 2.0');
      const result = await loader.parseAsync(buffer, '');
      if (version !== loadVersion) { disposeModel(result.scene); return; }
      if (currentModel) { scene.remove(currentModel); disposeModel(currentModel); }
      currentModel = result.scene; scene.add(currentModel); frameModel(currentModel); currentFile = keepFile;
      uploadButton.textContent = 'Загрузить и поделиться';
      filename.textContent = label; empty.style.display = 'none'; uploadButton.disabled = !currentFile; copyButton.hidden = true; shareUrl = '';
    }
    async function loadLocalFile(file) {
      if (uploading) { showError('Дождись окончания загрузки текущей модели.'); return; }
      errorBox.style.display = 'none'; if (!file) return;
      if (!file.name.toLowerCase().endsWith('.glb')) { showError('Нужен файл .glb. В Blender экспортируй модель через Файл → Экспорт → glTF 2.0 → Format: GLB.'); return; }
      if (file.size > MAX_FILE_BYTES) { showError('Файл больше 25 МБ. Уменьши модель или текстуры и экспортируй .glb заново.'); return; }
      const version = ++loadVersion;
      uploadButton.disabled = true;
      filename.textContent = `Загрузка: ${file.name}`;
      try { await displayGlb(await file.arrayBuffer(), file.name, file, version); }
      catch (err) { console.error(err); filename.textContent = 'Модель не загружена'; showError('Не удалось открыть файл. Проверь, что это корректный .glb.'); }
    }
    async function loadSharedModel(id) {
      if (!configured) { showError('Заполни настройки Appwrite в index.html.'); return; }
      if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,35}$/.test(id)) { showError('Некорректная ссылка на модель.'); return; }
      const version = ++loadVersion;
      uploadButton.disabled = true;
      filename.textContent = 'Загружаю общую модель…';
      try {
        const response = await fetch(storage.getFileView(APPWRITE_BUCKET_ID, id));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();
        if (buffer.byteLength > MAX_FILE_BYTES) throw new Error('Модель превышает лимит размера');
        await displayGlb(buffer, `Общая модель · ${id.slice(0, 8)}`, null, version);
      } catch (error) {
        if (version !== loadVersion) return;
        filename.textContent = 'Модель недоступна';
        showError('Не удалось открыть модель. Возможно, файл удалён, проект приостановлен или исчерпан лимит трафика.');
      }
    }
    function getStartParam() {
      const tg = window.Telegram?.WebApp;
      const query = new URLSearchParams(location.search);
      return tg?.initDataUnsafe?.start_param || query.get('tgWebAppStartParam') || query.get('model');
    }
    async function ensureSession() {
      try { return await account.get(); }
      catch (error) {
        if (error.code !== 401) throw error;
        await account.createAnonymousSession();
        return await account.get();
      }
    }
    async function uploadAndCreateLink() {
      errorBox.style.display = 'none';
      if (!currentFile || uploading) return;
      if (!configured) { showError('Заполни Endpoint, Project ID и Bucket ID Appwrite в index.html.'); return; }
      if (!/^[A-Za-z0-9_]{5,32}$/.test(BOT_USERNAME)) { showError('Укажи username бота без @ в BOT_USERNAME.'); return; }
      const file = currentFile;
      uploading = true;
      uploadButton.disabled = true; fileInput.disabled = true;
      uploadButton.textContent = 'Подключение…';
      try {
        const user = await ensureSession();
        const result = await storage.createFile(APPWRITE_BUCKET_ID, ID.unique(), file, [
          Permission.read(Role.any()),
          Permission.update(Role.user(user.$id)),
          Permission.delete(Role.user(user.$id))
        ], progress => { uploadButton.textContent = `Загрузка ${Math.round(progress.progress)}%`; });
        shareUrl = `https://t.me/${BOT_USERNAME}?startapp=${encodeURIComponent(result.$id)}`;
        copyButton.hidden = false;
        filename.textContent = `${file.name} · ссылка готова`;
        uploadButton.textContent = 'Загружено';
      } catch (error) {
        const messages = {
          401: 'Включи Anonymous sessions в настройках Auth Appwrite.',
          403: 'Проверь разрешение Create для Users и File security у bucket.',
          404: 'Проверь Endpoint, Project ID и Bucket ID.',
          413: 'Размер файла превышает ограничение bucket.',
          429: 'Слишком много запросов. Подожди немного и повтори.'
        };
        showError(messages[error.code] || `Ошибка загрузки: ${error.message || 'проверь интернет и настройки Appwrite'}`);
        uploadButton.disabled = false; uploadButton.textContent = 'Повторить загрузку';
      } finally { uploading = false; fileInput.disabled = false; }
    }
    async function copyShareLink() {
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(shareUrl);
        else { const area = document.createElement('textarea'); area.value = shareUrl; document.body.append(area); area.select(); const copied = document.execCommand('copy'); area.remove(); if (!copied) throw new Error('Clipboard unavailable'); }
        copyButton.textContent = 'Ссылка скопирована'; setTimeout(() => copyButton.textContent = 'Скопировать ссылку', 1800);
      } catch { showError(`Скопируй эту ссылку вручную: ${shareUrl}`); }
    }
    fileInput.addEventListener('change', e => { loadLocalFile(e.target.files?.[0]); e.target.value = ''; });
    document.querySelector('#open-file').addEventListener('click', () => fileInput.click());
    uploadButton.addEventListener('click', uploadAndCreateLink); copyButton.addEventListener('click', copyShareLink);
    document.querySelector('#reset').addEventListener('click', () => currentModel && frameModel(currentModel));
    angleSlider.addEventListener('input', event => setLightAngle(Number(event.target.value)));
    stage.addEventListener('dragover', e => e.preventDefault()); stage.addEventListener('drop', e => { e.preventDefault(); loadLocalFile(e.dataTransfer.files?.[0]); });
    if (tg) {
      tg.ready(); tg.expand(); tg.setBackgroundColor?.('#10131b'); tg.setBottomBarColor?.('#10131b');
      // Avoid competing with OrbitControls when dragging vertically to rotate the model.
      if (tg.isVersionAtLeast?.('7.7')) tg.disableVerticalSwipes();
    }
    const sharedId = getStartParam(); if (sharedId) loadSharedModel(sharedId);
  </script>
</body>
</html>
