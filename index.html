<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>3D-просмотрщик</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131b; color: #f5f6fa; }
    body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    header { min-height: 66px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:rgba(16,19,27,.92); border-bottom:1px solid #282d3a; z-index:2; }
    .brand { min-width:0; }
    h1 { font-size:16px; margin:0 0 3px; font-weight:700; }
    #filename { color:#9ca5b8; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:54vw; }
    button, .file-button { border:0; border-radius:12px; background:#6978ff; color:white; font:600 14px inherit; padding:11px 14px; cursor:pointer; white-space:nowrap; }
    button:active, .file-button:active { transform:scale(.98); }
    #stage { position:relative; flex:1; min-height:0; touch-action:none; }
    canvas { display:block; width:100%; height:100%; }
    #empty { position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; pointer-events:none; }
    #empty-card { max-width:330px; padding:25px; border:1px dashed #454d61; border-radius:20px; background:rgba(24,28,39,.88); }
    #empty .icon { font-size:38px; margin-bottom:10px; }
    #empty p { color:#aeb6c7; font-size:14px; line-height:1.5; margin:8px 0 0; }
    #hint { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100% - 24px); border-radius:999px; padding:9px 13px; color:#d9deeb; background:rgba(12,15,22,.72); font-size:12px; text-align:center; pointer-events:none; }
    #error { display:none; position:absolute; left:12px; right:12px; top:12px; padding:12px 14px; background:#642e3c; border:1px solid #a84c62; border-radius:12px; font-size:13px; line-height:1.4; z-index:1; }
    footer { display:flex; gap:9px; padding:11px 12px calc(11px + env(safe-area-inset-bottom)); background:#10131b; border-top:1px solid #282d3a; }
    footer button { flex:1; background:#252b39; }
    footer button.primary { background:#6978ff; }
    input[type=file] { display:none; }
    @media (min-width:700px) { header { padding-left:22px; padding-right:22px; } footer { justify-content:center; } footer button { flex:initial; min-width:130px; } }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header>
    <div class="brand"><h1>3D‑просмотрщик</h1><div id="filename">Модель не загружена</div></div>
    <label class="file-button" for="file">Открыть модель</label>
    <input id="file" type="file" accept=".glb,model/gltf-binary">
  </header>
  <main id="stage">
    <div id="empty"><div id="empty-card"><div class="icon">◇</div><strong>Загрузите 3D-модель</strong><p>Выберите файл <b>.glb</b>. Перетаскивайте модель пальцем, чтобы вращать; сведите или разведите пальцы для масштаба.</p></div></div>
    <div id="error"></div>
    <div id="hint">Вращение — перетаскивание · масштаб — щипок или колёсико</div>
  </main>
  <footer>
    <button id="reset">Сбросить вид</button>
    <button id="light">Сменить фон</button>
    <button class="primary" id="open-bottom">Загрузить .glb</button>
  </footer>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const stage = document.querySelector('#stage');
    const fileInput = document.querySelector('#file');
    const filename = document.querySelector('#filename');
    const empty = document.querySelector('#empty');
    const errorBox = document.querySelector('#error');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#171b26');
    const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 1000);
    camera.position.set(3, 2.2, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    stage.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x657089, 2.1));
    const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(4, 7, 5); scene.add(key);
    const fill = new THREE.DirectionalLight(0x9dafff, 1.3); fill.position.set(-5, 2, -4); scene.add(fill);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.07;
    controls.minDistance = 0.03; controls.maxDistance = 500;
    controls.target.set(0, 0, 0);
    const loader = new GLTFLoader();
    let currentModel = null;
    let bgIndex = 0;
    const backgrounds = ['#171b26', '#e8eaf0', '#111827'];

    function resize() {
      const w = Math.max(stage.clientWidth, 1), h = Math.max(stage.clientHeight, 1);
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage); resize();
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();

    function disposeModel(obj) {
      obj.traverse(node => {
        if (node.geometry) node.geometry.dispose();
        if (node.material) for (const mat of (Array.isArray(node.material) ? node.material : [node.material])) {
          for (const value of Object.values(mat)) if (value && value.isTexture) value.dispose();
          mat.dispose();
        }
      });
    }
    function showError(message) { errorBox.textContent = message; errorBox.style.display = 'block'; }
    function frameModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const distance = (maxDim / 2) / Math.tan(fov / 2) * 1.55;
      camera.position.set(distance * 0.9, distance * 0.62, distance * 1.05);
      camera.near = Math.max(maxDim / 1000, 0.001); camera.far = maxDim * 100; camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0); controls.minDistance = maxDim * 0.05; controls.maxDistance = maxDim * 30; controls.update();
    }
    async function loadFile(file) {
      errorBox.style.display = 'none';
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.glb')) { showError('Этот вариант просмотрщика принимает файлы .glb. В Blender выберите: Файл → Экспорт → glTF 2.0 → Format: GLB.'); return; }
      filename.textContent = `Загрузка: ${file.name}`;
      try {
        const buffer = await file.arrayBuffer();
        const result = await loader.parseAsync(buffer, '');
        const nextModel = result.scene;
        if (currentModel) { scene.remove(currentModel); disposeModel(currentModel); }
        currentModel = nextModel; scene.add(currentModel); frameModel(currentModel);
        filename.textContent = file.name; empty.style.display = 'none';
      } catch (err) {
        console.error(err); filename.textContent = 'Модель не загружена';
        showError('Не удалось открыть файл. Проверьте, что это корректный .glb, затем попробуйте экспортировать модель заново.');
      }
    }
    fileInput.addEventListener('change', e => loadFile(e.target.files?.[0]));
    document.querySelector('#open-bottom').addEventListener('click', () => fileInput.click());
    document.querySelector('#reset').addEventListener('click', () => currentModel && frameModel(currentModel));
    document.querySelector('#light').addEventListener('click', () => { bgIndex = (bgIndex + 1) % backgrounds.length; scene.background.set(backgrounds[bgIndex]); });
    stage.addEventListener('dragover', e => { e.preventDefault(); });
    stage.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files?.[0]); });
    if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
  </script>
</body>
</html>
